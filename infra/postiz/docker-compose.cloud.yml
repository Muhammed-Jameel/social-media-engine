services:
  postiz:
    # Reproducible upload-only TikTok adapter; build before starting cloud Postiz.
    image: aurendor/postiz:2.23.0-tiktok-upload-only-1
    build:
      context: ./tiktok-upload-only
    pull_policy: never
    environment:
      MAIN_URL: https://${POSTIZ_HOSTNAME:?Set POSTIZ_HOSTNAME in the private environment file}
      FRONTEND_URL: https://${POSTIZ_HOSTNAME:?Set POSTIZ_HOSTNAME in the private environment file}
      NEXT_PUBLIC_BACKEND_URL: https://${POSTIZ_HOSTNAME:?Set POSTIZ_HOSTNAME in the private environment file}/api
      # An empty value keeps Postiz's Secure/SameSite=None production cookies.
      NOT_SECURED: ""

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      POSTIZ_HOSTNAME: ${POSTIZ_HOSTNAME:?Set POSTIZ_HOSTNAME in the private environment file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - postiz
    depends_on:
      postiz:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
