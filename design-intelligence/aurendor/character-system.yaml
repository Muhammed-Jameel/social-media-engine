schemaVersion: 1.0.0
status: prototype-no-permanent-mascot
recommendation: hybrid
defaultModes:
  - abstract-anthropomorphism
  - object-anthropomorphism
  - selective-character-entity
levelScale:
  0: "No anthropomorphism; pure editorial, product, or evidence-led communication."
  1: "Implied human behavior through path, pause, alignment, or effort."
  2: "Objects interact or coordinate without character anatomy."
  3: "Character-like form with gesture or pose; face usually unnecessary."
  4: "Full character with controlled expression; exceptional use."
  5: "Narrative scene with multiple actors, environment, and consequence; rare."
conceptMechanisms:
  coordination: [handoff, synchronized-lift, shared-path, assembly]
  overload: [congestion, compression, queue, dropped-load]
  discovery: [search, reveal, selection, excavation]
  organization: [sorting, alignment, containment, indexing]
  uncertainty: [missing-piece, unstable-path, incomplete-map, confidence-boundary]
  memory: [archive, retrieval, association, decay-and-recovery]
  protection: [boundary, escort, filtration, quarantine]
  failure: [stall, drift, collision, graceful-fallback]
  scale: [replication-with-control, widening-channel, coordinated-expansion]
  transformation: [chaos-to-order, isolated-to-connected, opaque-to-legible]
faceTest:
  question: "If eyes and mouth are removed, does behavior still communicate the concept?"
  failAction: "Return to level 1–3 and redesign pose, interaction, or state."
capabilityEthics:
  prohibitedImplications: [sentience, perfect-knowledge, empathy, autonomous-authority, guaranteed-outcome]
  required: [capability-boundary, evidence-state, permission-or-human-handoff-when-relevant]
recurringEntityGate:
  requiredViews: [front, side, three-quarter]
  requiredStudies: [silhouette, proportions, material, scale, pose-language, expression-range, lighting-response]
  originalityReview: "Compare silhouette, proportions, face, materials, and pose language against nearest corpus and public character systems."
  adoptionCondition: "Recognition and maturity must improve across the controlled benchmark without reducing content flexibility."
