schemaVersion: "1.0.0"
artifactType: "social_media_plugin_forbidden_patterns"
brandVersion: "final-2026.1"
effectiveAt: "2026-08-23T00:00:00+03:00"
status: "active"
purpose: >-
  Prevent technically valid but amateur, generic, unsafe, repetitive, or reference-copying
  creative from entering SOCIAL_MEDIA_PLUGIN production.

evidence:
  failureAnalysis: "design-intelligence/reports/CREATIVE_FAILURE_ANALYSIS.md"
  renderer: "packages/engine/src/creative.ts"
  workflow: "packages/engine/src/workflows.ts"
  benchmarkReview: "artifacts/creative-benchmarks/visual-review-2026-08-23.json"
  oldOutputs: "apps/web/public/demo-content"
  canonicalVisualSystem: "data/brand/visual-system.yaml"
  referenceCorpusManifest: "design-intelligence/corpus/manifest.json"

decisionSemantics:
  automatic_reject: "Reject the candidate immediately; a numeric score cannot override it."
  regenerate: "Reject the concept and return to materially different concept generation."
  revise: "Permit one bounded, evidence-specific revision before re-rendering and re-critique."
  block_pipeline: "Stop the workflow until the missing system capability or evidence exists."

globalRules:
  metadataIsNotVisualEvidence: true
  promptIsNotRenderedEvidence: true
  providerSuccessIsNotCreativeApproval: true
  numericScoreCannotOverrideHardFail: true
  ownerApprovalCannotReplaceCreativeCritique: true
  changedRasterInvalidatesPriorCritique: true
  changedCopyFontOrAssetInvalidatesPriorApproval: true
  maximumTargetedRevisionsBeforeConceptRestart: 2

patterns:
  - id: "FP-CONCEPT-001"
    name: "No message-specific visual concept"
    category: "concept"
    severity: "automatic_reject"
    definition: >-
      The composition only displays the copy or topic and has no visual metaphor, story,
      tension, transformation, evidence mechanism, or message-specific focal object.
    visibleSignals:
      - "Headline, support copy, and logo are the only meaningful elements."
      - "The image cannot communicate a useful idea when the headline is hidden."
      - "The stated concept is an aesthetic label such as editorial, premium, or high-tech."
    requiredControl: >-
      Require a one-second takeaway, visual mechanism, textless-comprehension assessment,
      and concept-selection rationale before production.

  - id: "FP-CONCEPT-002"
    name: "Generic technology decoration"
    category: "concept"
    severity: "regenerate"
    definition: >-
      Systems lines, particles, grids, circuits, glowing nodes, abstract frames, or geometry
      are used as atmosphere without explaining the content.
    visibleSignals:
      - "Removing the decoration does not change the message."
      - "The same motif could be applied to unrelated AI, SaaS, finance, or consulting posts."
      - "The motif has no documented hierarchy, framing, directional, or storytelling role."
    requiredControl: "Every non-text element must declare and visibly perform a communication role."

  - id: "FP-CONCEPT-003"
    name: "Generic AI cliché"
    category: "imagery"
    severity: "automatic_reject"
    definition: >-
      AI is represented by a glowing brain, generic robot head, circuit globe, random humanoid,
      blue-neon data tunnel, or ornamental particles without a post-specific idea.
    visibleSignals:
      - "Robot or brain imagery substitutes for an operational story."
      - "The image implies capability unsupported by the content or product."
    requiredControl: >-
      Represent the actual behavior, conflict, decision, workflow, memory, search, or transformation
      described by the post.

  - id: "FP-CONCEPT-004"
    name: "Childish or indiscriminate anthropomorphism"
    category: "anthropomorphism"
    severity: "automatic_reject"
    definition: >-
      Cute faces, cartoon robots, mascot behavior, or character styling weakens SOCIAL_MEDIA_PLUGIN's calm,
      authoritative, infrastructural positioning or appears without conceptual need.
    visibleSignals:
      - "Eyes or limbs are added to an object merely to make it friendly."
      - "Character styling resembles children's software or a generic startup mascot."
      - "Every post uses the same anthropomorphism level regardless of message."
    requiredControl: >-
      Select anthropomorphism level 0-5 per concept and require a premium material, behavior,
      silhouette, lighting, and narrative rationale.

  - id: "FP-LAYOUT-001"
    name: "Rigid template substitution"
    category: "composition"
    severity: "automatic_reject"
    definition: >-
      A previous layout is reused with swapped text, icons, color mode, or image while preserving
      substantially the same focal zones, furniture, spacing, and reading path.
    visibleSignals:
      - "Recurring fixed frame, metadata, headline zone, action rail, and footer."
      - "Changing the content does not change the composition."
      - "The output resembles a generic Canva template family."
    requiredControl: >-
      Compare text/color-independent structural signatures and visual embeddings against the recent
      30-post window; require message-based layout-family selection.

  - id: "FP-LAYOUT-002"
    name: "Unjustified near-duplicate feed creative"
    category: "composition"
    severity: "automatic_reject"
    definition: >-
      The candidate repeats the structural composition of recent work closely enough to create feed
      fatigue without a documented campaign or sequence reason.
    visibleSignals:
      - "Only copy, icon, or accent color changes."
      - "Three-, nine-, or twelve-post simulation reveals a repeated silhouette."
      - "Exact hashes differ while the visual structure remains the same."
    requiredControl: >-
      Use structural fingerprints, perceptual similarity, feed simulation, and independent critic review;
      exact SHA comparison alone is insufficient.

  - id: "FP-LAYOUT-003"
    name: "Disconnected composition islands"
    category: "composition"
    severity: "revise"
    definition: >-
      Headline, diagram, support, CTA, image, and branding occupy separate zones without visual or
      semantic relationships that guide the eye.
    visibleSignals:
      - "Large gaps interrupt the intended reading path."
      - "Elements appear balanced only by occupying empty areas."
      - "CTA or evidence rail feels attached after the main design was complete."
    requiredControl: "Document focal weights, eye path, element relationships, and center of gravity in the brief."

  - id: "FP-LAYOUT-004"
    name: "Dead or accidental negative space"
    category: "composition"
    severity: "revise"
    definition: >-
      Empty space does not create emphasis, tension, pacing, luxury, or a clear counterweight and instead
      reads as unfinished layout.
    visibleSignals:
      - "Visual mass is concentrated on one side without a deliberate counter-anchor."
      - "The eye leaves the canvas instead of returning to the focal point."
    requiredControl: "Critics must distinguish functional negative space from unoccupied canvas."

  - id: "FP-LAYOUT-005"
    name: "Arbitrary icon tray or card collection"
    category: "composition"
    severity: "regenerate"
    definition: >-
      Multiple outline icons, cards, pills, badges, or containers list concepts without establishing a
      visual story, hierarchy, or meaningful relationship.
    visibleSignals:
      - "Icons could be replaced with unrelated icons without affecting comprehension."
      - "Every item has equal visual weight."
      - "The tray exists mainly to fill the lower canvas."
    requiredControl: "Prefer one dominant conceptual object or a deliberately sequenced information system."

  - id: "FP-TYPE-001"
    name: "Arabic treated as mirrored English"
    category: "arabic_typography"
    severity: "automatic_reject"
    definition: >-
      Arabic is merely right-aligned or geometrically mirrored from an LTR composition without an Arabic-first
      reading path, line rhythm, punctuation policy, or optical balance.
    visibleSignals:
      - "RTL text is centered around arbitrary anchors."
      - "Latin labels dominate or interrupt the Arabic hierarchy without intent."
      - "The composition only works when read as an English layout."
    requiredControl: "Require a dedicated Arabic composition plan and an independent Arabic design reviewer."

  - id: "FP-TYPE-002"
    name: "Character-count typography"
    category: "typography"
    severity: "automatic_reject"
    definition: >-
      Line wrapping, size, clipping risk, or density is determined primarily by character count rather than
      rendered glyph measurement and authored line breaks.
    visibleSignals:
      - "Awkward display line breaks or orphan words."
      - "Uneven line shapes despite similar character budgets."
      - "Different exporters materially change fit."
    requiredControl: >-
      Use embedded production fonts, glyph-aware measurement, explicit line breaks, bounding-box inspection,
      and mobile raster verification.

  - id: "FP-TYPE-003"
    name: "Declared font mistaken for rendered font"
    category: "typography"
    severity: "block_pipeline"
    definition: >-
      A font passes because its family name appears in source metadata while loading, embedding, glyph substitution,
      or synthetic weight remains unverified.
    visibleSignals:
      - "Font files are absent from the export."
      - "Browser font readiness or font hash evidence is missing."
      - "A requested weight is unavailable and synthetically rendered."
    requiredControl: "Bind font file hashes and loaded-weight evidence to each rasterization result."

  - id: "FP-TYPE-004"
    name: "Excessive or equally weighted on-design copy"
    category: "typography"
    severity: "automatic_reject"
    definition: >-
      The viewer cannot identify the first, second, and third reading priorities at mobile size, or the copy volume
      forces cramped line length and insufficient whitespace.
    visibleSignals:
      - "Headline, support, metadata, and CTA compete at similar scale or contrast."
      - "Body copy performs the work of the caption."
    requiredControl: "Apply one idea per frame, authored hierarchy weights, and mobile-scale pixel critique."

  - id: "FP-CRAFT-001"
    name: "Flatness without conceptual purpose"
    category: "visual_craft"
    severity: "regenerate"
    definition: >-
      Flat text, cards, borders, and linework are used by default when the concept requires dimensional crop,
      product context, materiality, atmosphere, or a foreground/midground/background relationship.
    visibleSignals:
      - "All elements sit on one visual plane."
      - "No focal object, crop, overlap, perspective, light, texture, or depth supports the message."
    requiredControl: >-
      Require an explicit depth decision; minimal flat design remains allowed only when its concept and typography
      are sufficiently strong.

  - id: "FP-CRAFT-002"
    name: "Semantically meaningless control or motif"
    category: "visual_craft"
    severity: "revise"
    definition: >-
      A plus icon, arrow, badge, underline, frame, CTA rail, or decorative object implies an action or meaning that
      the adjacent copy does not support.
    visibleSignals:
      - "A control-like symbol accompanies a non-interactive slogan."
      - "Decorative emphasis points away from the intended focal message."
    requiredControl: "Every micro-element must have a documented semantic, hierarchy, framing, or rhythm function."

  - id: "FP-CRAFT-003"
    name: "Low-integrity imagery or UI"
    category: "imagery"
    severity: "automatic_reject"
    definition: >-
      The design contains fake, implausible, distorted, low-resolution, watermarked, poorly masked, or provenance-unknown
      photography, product UI, people, devices, charts, or generated assets.
    visibleSignals:
      - "Broken perspective, inconsistent light, malformed details, or unreadable fake UI."
      - "Source, license, or content hash is missing."
    requiredControl: "Use approved real product context or licensed/generated assets with provenance and pixel inspection."

  - id: "FP-IMAGERY-004"
    name: "People used as attention bait"
    category: "imagery"
    severity: "automatic_reject"
    definition: >-
      A person is included without a necessary narrative role, or is posed, cropped, styled,
      sexualized, or objectified primarily to attract attention. This explicitly includes using
      women as decorative brand objects rather than subjects with agency.
    visibleSignals:
      - "Removing the person leaves the story and meaning unchanged."
      - "The pose, crop, wardrobe, or gaze serves attraction rather than the subject's work or decision."
      - "The brief has no documented reason that a human subject is necessary."
    requiredControl: >-
      Default to real product UI, workflows, objects, environments, hands, or motion graphics.
      When a person is essential, document their narrative role and portray them as an active
      professional subject. Never classify gender from pixels; review declared casting intent and treatment.

  - id: "FP-BRAND-001"
    name: "Logo and green mistaken for distinctiveness"
    category: "brand"
    severity: "automatic_reject"
    definition: >-
      Brand quality is claimed primarily because the design contains the canonical logo and green palette while its
      concept, composition, imagery, and craft remain generic.
    visibleSignals:
      - "Removing the logo makes the design indistinguishable from another SaaS or AI brand."
      - "Brand score is derived from token presence rather than visual behavior."
    requiredControl: "Critics must assess SOCIAL_MEDIA_PLUGIN recognizability with the logo hidden."

  - id: "FP-BRAND-002"
    name: "Archived or contradictory brand system"
    category: "brand"
    severity: "automatic_reject"
    definition: >-
      Archived Sovereign Field cream/gold, unrelated rose/blue palettes, unapproved fonts, mixed icon families,
      or a conflicting brand direction enters current production without an explicit versioned owner decision.
    visibleSignals:
      - "Current and archived identity tokens are mixed."
      - "A provider template silently substitutes its own aesthetic."
    requiredControl: "Verify active brand/version and source hashes before design production."

  - id: "FP-EVAL-001"
    name: "Source or metadata self-approval"
    category: "evaluation"
    severity: "block_pipeline"
    definition: >-
      Qualitative design scores are granted from SVG tags, element names, prompt text, provider metadata, copy hashes,
      or declared colors/fonts rather than the final rendered pixels.
    visibleSignals:
      - "Hierarchy passes because named groups exist."
      - "Whitespace passes because copy is short."
      - "Contrast passes from declared metadata without sampling rendered foreground/background."
      - "Different designs receive identical constant qualitative scores."
    requiredControl: "Limit deterministic checks to technical facts and require independent pixel-grounded critics."

  - id: "FP-EVAL-002"
    name: "Missing or stale independent critics"
    category: "evaluation"
    severity: "block_pipeline"
    definition: >-
      A candidate advances without every required critic inspecting the exact current original-resolution raster hash
      and a representative mobile preview.
    visibleSignals:
      - "Review applies to a pre-revision hash."
      - "Smoke-check implementer is treated as an independent critic."
      - "Arabic content lacks an Arabic design reviewer."
    requiredControl: "Bind frozen critic artifacts to ordered current asset hashes; any render change invalidates them."

  - id: "FP-EVAL-003"
    name: "Unbounded cosmetic revision loop"
    category: "evaluation"
    severity: "regenerate"
    definition: >-
      Repeated iterations move, resize, recolor, or decorate the same weak concept without resolving the underlying
      communication or originality failure.
    visibleSignals:
      - "The same concept fails more than two targeted revisions."
      - "Revision instructions are stored but pixels remain unchanged."
    requiredControl: "After two failed targeted revisions, reject the concept and generate materially different directions."

  - id: "FP-REFERENCE-001"
    name: "Reference imitation or tracing"
    category: "reference_safety"
    severity: "automatic_reject"
    definition: >-
      An SOCIAL_MEDIA_PLUGIN candidate reproduces the distinctive composition, artwork, character, graphic, or overall trade dress
      of a professional reference too closely.
    visibleSignals:
      - "Reference-specific arrangement survives with only colors, logo, or copy changed."
      - "Copyrighted graphics are extracted, traced, or reused."
    requiredControl: >-
      Retrieve principles with why-it-works and do-not-copy fields; run pairwise similarity and an originality critic
      before candidate selection.

releaseBlockers:
  - id: "RB-01"
    blocker: "Production visual-generation pause is not technically enforced."
    requiredEvidence: "Auditable pause state that allows isolated research and benchmark experiments only."
  - id: "RB-02"
    blocker: "Professional corpus interpretation and golden-anchor selection are incomplete."
    requiredEvidence: "Human/multimodal taxonomy, exceptional references, principles, and approved quality anchors."
  - id: "RB-03"
    blocker: "Reference retrieval is not wired into production art direction."
    requiredEvidence: "Persisted per-post retrieval packet with relevance rationale and anti-copy constraints."
  - id: "RB-04"
    blocker: "Art direction is not an executable artifact-producing workflow service."
    requiredEvidence: "Multiple structured concepts, pairwise selection, selected rationale, and schema-valid brief."
  - id: "RB-05"
    blocker: "Renderer discards most design intent and supports only two template layouts."
    requiredEvidence: "Materially different scene graphs/renders from identical copy across multiple layout families."
  - id: "RB-06"
    blocker: "Revision does not causally modify rendered pixels."
    requiredEvidence: "New raster hash, pixel diff, resolved finding IDs, and concept-restart behavior after bounded failure."
  - id: "RB-07"
    blocker: "Arabic typography is not production-safe."
    requiredEvidence: "Embedded fonts, glyph bounds, authored line breaks, mobile rasters, and independent Arabic review."
  - id: "RB-08"
    blocker: "Qualitative evaluation relies on metadata rather than pixels."
    requiredEvidence: "Binary technical preflight plus independent original-resolution pixel critics."
  - id: "RB-09"
    blocker: "The professional 160-point rubric and automatic rejections are not enforced."
    requiredEvidence: "Evidence-citing critic artifacts with calibrated thresholds and hard-fail precedence."
  - id: "RB-10"
    blocker: "Near-duplicate and feed-fatigue controls are absent."
    requiredEvidence: "Structural/perceptual similarity checks and 3-, 9-, and 12-post feed evaluations."
  - id: "RB-11"
    blocker: "SOCIAL_MEDIA_PLUGIN visual grammar and premium anthropomorphic system are incomplete."
    requiredEvidence: "Approved visual-world, Arabic, imagery, material, depth, and anthropomorphism rules."
  - id: "RB-12"
    blocker: "Controlled ten-type creative benchmark has not passed."
    requiredEvidence: "Multiple candidates, rejected weak concepts, iterated strong concepts, and inspected current pixels."
  - id: "RB-13"
    blocker: "Rebuilt engine has not decisively beaten old output on identical briefs."
    requiredEvidence: "Blind or semi-blind pairwise evaluation across concept, composition, type, craft, brand, and communication."
  - id: "RB-14"
    blocker: "No hash-bound SOCIAL_MEDIA_PLUGIN golden set has been approved."
    requiredEvidence: "Original SOCIAL_MEDIA_PLUGIN assets passing professional comparison, all current-hash critics, and owner approval."

releaseGate:
  productionVisualGeneration: "blocked"
  resumeRequires:
    - "All releaseBlockers are closed with durable evidence."
    - "No candidate matches any automatic_reject pattern."
    - "No candidate matches a block_pipeline pattern."
    - "Every required critic reviewed the exact current raster hashes."
    - "Candidate score is at least 145/160 with no hard fail."
    - "Blind old-vs-new comparison decisively favors the rebuilt system."
    - "Owner approval remains separate and current-hash bound."
