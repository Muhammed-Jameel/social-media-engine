schemaVersion: 1.0.0
domain: typography
principles:
  - id: TYPE_DISPLAY_AS_COMPOSITION
    name: Display type participates in the composition
    description: "Treat headline shape, line length, and counter-space as visual masses that interact with the image rather than labels placed afterward."
    whyItWorks: "When type and imagery share one geometry, the design feels authored and the message becomes inseparable from its visual expression."
    appropriateFor: [awareness, thought-leadership, editorial, announcement, brand-building]
    avoidWhen: [long-form-body, dense-data]
    visualFamilies: [editorial-statement, conceptual-hero, announcement]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3]
    strongReferenceIds: [ref_f5cec23c32415d6e, ref_97c66851c15d6c1f, ref_8871f98455278188]
    aurendorApplication: "Choose authored line breaks while sketching the concept; let Ghroob or Dh Ranclo create a counter-mass to the focal object."
    retrievalTags: [display, type, composition, headline, integration]
    mustNotCopy: "Do not imitate a source's line silhouette, type treatment, or word emphasis."
  - id: TYPE_STEEP_SCALE_CONTRAST
    name: Steep scale contrast
    description: "Create decisive separation between the thesis, support, evidence, and metadata instead of using adjacent type sizes."
    whyItWorks: "Large scale differences clarify reading order and create confidence; timid differences make every block look equally important."
    appropriateFor: [awareness, education, promotion, thought-leadership, statistic, editorial]
    avoidWhen: [formal-report-table]
    visualFamilies: [conceptual-hero, editorial-statement, data-story, announcement]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_97c66851c15d6c1f, ref_7ea2e6edfd24a465, ref_8ef6ff7e70837523]
    aurendorApplication: "Start from a 3:1 perceived display-to-support ratio and adjust optically for script, length, and mobile preview."
    retrievalTags: [scale, contrast, hierarchy, type, mobile]
    mustNotCopy: "Do not reuse source sizes, line counts, or typographic proportions."
  - id: TYPE_MEASURE_SUPPORT_COPY
    name: Measure supporting copy
    description: "Give body and evidence copy a controlled line length, generous leading, and a clear maximum role in the canvas."
    whyItWorks: "Measured text reads as editorial information rather than a disclaimer squeezed into leftover space."
    appropriateFor: [education, service-explanation, case-study, thought-leadership]
    avoidWhen: [single-word-hero]
    visualFamilies: [editorial-statement, case-study, process-explainer, arabic-educational-carousel]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3]
    strongReferenceIds: [ref_4afce40fe49062b6, ref_7ea2e6edfd24a465, ref_51e708951ea61f18]
    aurendorApplication: "Cap supporting blocks by role and move surplus content to the next slide or caption rather than shrinking the font."
    retrievalTags: [measure, body, leading, density, editorial]
    mustNotCopy: "Do not copy source paragraph widths, microcopy, or text-box proportions."
  - id: TYPE_ONE_EMPHASIS_LOGIC
    name: One emphasis logic
    description: "Use one repeatable method—weight, color, scale, or position—to emphasize key words within a post."
    whyItWorks: "A coherent emphasis rule reinforces the idea while mixed underlines, italics, pills, and colors create arbitrary noise."
    appropriateFor: [education, thought-leadership, statistic, announcement]
    avoidWhen: [expressive-type-experiment]
    visualFamilies: [editorial-statement, data-story, announcement, arabic-educational-carousel]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2]
    strongReferenceIds: [ref_51e708951ea61f18, ref_f5cec23c32415d6e, ref_7ea2e6edfd24a465]
    aurendorApplication: "Use neon as a semantic charge on one word or relationship, not as a generic highlight across every card."
    retrievalTags: [emphasis, color, weight, consistency, type]
    mustNotCopy: "Do not imitate a source's highlight device, word choice, or colored blocks."
  - id: TYPE_FONT_RENDER_PROOF
    name: Font rendering must be proven
    description: "Verify that production font files loaded, shaped, and exported at the current asset hash rather than checking family names in source code."
    whyItWorks: "Metadata cannot reveal fallback glyphs, altered metrics, broken joins, or export-time clipping."
    appropriateFor: [awareness, education, promotion, announcement, case-study, editorial]
    avoidWhen: [none]
    visualFamilies: [conceptual-hero, editorial-statement, product-system-story, data-story, announcement, arabic-educational-carousel]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_8871f98455278188, ref_8ef6ff7e70837523, ref_7ea2e6edfd24a465]
    aurendorApplication: "Record font-file hashes and browser readiness, then inspect original and mobile pixels before a critic can score typography."
    retrievalTags: [font, render, proof, pixels, qa]
    mustNotCopy: "References establish craft expectations only and never authorize use of their typefaces or lettering."
