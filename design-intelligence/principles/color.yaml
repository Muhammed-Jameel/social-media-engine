schemaVersion: 1.0.0
domain: color
principles:
  - id: COLOR_DOMINANT_FIELD_ACCENT_CHARGE
    name: Dominant field with charged accent
    description: "Let one field establish atmosphere, a secondary range create depth, and a scarce accent identify action or transformation."
    whyItWorks: "Color hierarchy supports information hierarchy and makes the accent feel meaningful instead of decorative."
    appropriateFor: [awareness, education, product-introduction, thought-leadership, brand-building]
    avoidWhen: [multivariate-data-chart]
    visualFamilies: [conceptual-hero, editorial-statement, product-system-story, character-narrative]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_51e708951ea61f18, ref_7ea2e6edfd24a465, ref_f5cec23c32415d6e]
    aurendorApplication: "Use deep green or paper as the world, mid/pale tones for depth, and neon only where intelligence, action, or resolved flow is visible."
    retrievalTags: [color, accent, green, hierarchy, atmosphere]
    mustNotCopy: "Do not sample or reproduce a source palette or gradient."
  - id: COLOR_SEMANTIC_NOT_SKIN
    name: Color communicates state
    description: "Assign color to meaning—uncertainty, evidence, handoff, failure, resolution—rather than applying brand colors uniformly to every object."
    whyItWorks: "Semantic color makes systems understandable and prevents a monochrome brand treatment from flattening relationships."
    appropriateFor: [education, service-explanation, data-story, process, case-study]
    avoidWhen: [single-emotional-portrait]
    visualFamilies: [product-system-story, data-story, process-explainer, before-after]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3, 4]
    strongReferenceIds: [ref_51e708951ea61f18, ref_4afce40fe49062b6, ref_f5cec23c32415d6e]
    aurendorApplication: "Record the meaning of each non-neutral color in the brief and remove color changes with no state or hierarchy role."
    retrievalTags: [semantic, state, evidence, process, system]
    mustNotCopy: "Do not adopt another campaign's color-state mapping."
  - id: COLOR_MATERIAL_LIGHT_BEFORE_GLOW
    name: Material light before glow
    description: "Use believable surface response, local contrast, and controlled illumination before adding bloom or neon effects."
    whyItWorks: "Material light creates depth and credibility; generic glow makes technology imagery feel synthetic and interchangeable."
    appropriateFor: [product-introduction, storytelling, brand-building, promotion]
    avoidWhen: [flat-editorial-illustration]
    visualFamilies: [conceptual-hero, product-system-story, character-narrative]
    languages: [ar, en]
    anthropomorphismLevels: [1, 2, 3, 4, 5]
    strongReferenceIds: [ref_2ca843f06643d5f6, ref_6dd0a9246092f4d5, ref_51e708951ea61f18]
    aurendorApplication: "Light the AURENDOR world as a physical environment; reserve pale-neon spill for active intelligence and verify it does not wash out Arabic type."
    retrievalTags: [light, material, glow, depth, premium]
    mustNotCopy: "Do not replicate source lighting, reflections, atmosphere, or surface colors."
  - id: COLOR_FEED_BALANCE
    name: Color is scheduled across the feed
    description: "Alternate light, dark, saturated, and restrained posts intentionally so no single field or accent creates fatigue."
    whyItWorks: "Feed-level color rhythm increases recognition while allowing each post to have a distinct emotional role."
    appropriateFor: [awareness, education, promotion, announcement, thought-leadership, brand-building]
    avoidWhen: [single-post-only]
    visualFamilies: [conceptual-hero, editorial-statement, product-system-story, data-story, character-narrative]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_51e708951ea61f18, ref_f5cec23c32415d6e, ref_7ea2e6edfd24a465]
    aurendorApplication: "Assign each post a feed rhythm role and reject a nine-post plan dominated by the same green field or neon intensity."
    retrievalTags: [feed, rhythm, fatigue, color, campaign]
    mustNotCopy: "Do not copy a source campaign's color sequence or grid."
