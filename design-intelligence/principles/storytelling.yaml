schemaVersion: 1.0.0
domain: storytelling
principles:
  - id: STORY_ONE_VERB
    name: One visual verb
    description: "Build the concept around one observable action such as finding, sorting, connecting, protecting, escaping, or recovering."
    whyItWorks: "A verb turns a static collection of objects into a story that can be understood before the caption."
    appropriateFor: [awareness, education, service-explanation, product-introduction, storytelling, conversion]
    avoidWhen: [formal-announcement, quote]
    visualFamilies: [conceptual-hero, product-system-story, character-narrative, before-after]
    languages: [ar, en]
    anthropomorphismLevels: [1, 2, 3, 4, 5]
    strongReferenceIds: [ref_6dd0a9246092f4d5, ref_51e708951ea61f18, ref_f5593ec327689f0a]
    aurendorApplication: "Name the operational verb in the art-direction record and remove any object that does not participate in it."
    retrievalTags: [action, verb, story, immediate, behavior]
    mustNotCopy: "Do not reuse a source's action, actors, props, or setting as a finished scene."
  - id: STORY_TENSION_THEN_RESOLUTION
    name: Visible tension and resolution
    description: "Show a condition with stakes and imply or reveal the mechanism that changes it, rather than illustrating a generic positive outcome."
    whyItWorks: "Contrast creates curiosity and gives the product or idea a causal role instead of decorative presence."
    appropriateFor: [education, service-explanation, case-study, conversion, storytelling]
    avoidWhen: [solemn-announcement, compliance-message]
    visualFamilies: [before-after, conceptual-hero, character-narrative, product-system-story]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_51e708951ea61f18, ref_2ca843f06643d5f6, ref_6dd0a9246092f4d5]
    aurendorApplication: "Make the cost of fragmentation, uncertainty, or delay visible; let the AURENDOR mechanism organize the frame rather than appear as a logo."
    retrievalTags: [problem, solution, stakes, transformation, contrast]
    mustNotCopy: "Do not duplicate the source before/after metaphor or staging."
  - id: STORY_COPY_COMPLETES_IMAGE
    name: Verbal and visual completion
    description: "Let the headline name the insight while the image supplies the proof, twist, or emotional consequence; avoid saying the same thing twice."
    whyItWorks: "Complementary channels reward the viewer for combining them and make the communication more memorable."
    appropriateFor: [awareness, promotion, thought-leadership, storytelling, editorial]
    avoidWhen: [safety-instruction, legal-notice]
    visualFamilies: [conceptual-hero, editorial-statement, character-narrative]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_6dd0a9246092f4d5, ref_51e708951ea61f18, ref_8871f98455278188]
    aurendorApplication: "Write the Arabic headline and sketch the image together; reject concepts where either merely captions the other."
    retrievalTags: [copy, image, idea, twist, memory]
    mustNotCopy: "Do not reuse a source headline construction, visual pun, or branded object."
  - id: STORY_STATE_TRANSFORMATION
    name: System states become narrative
    description: "Express infrastructure through visible transitions between chaos and order, missing and retrieved, blocked and flowing, or isolated and coordinated."
    whyItWorks: "State change makes an invisible technical capability concrete without resorting to generic circuitry or dashboard decoration."
    appropriateFor: [education, service-explanation, product-introduction, case-study, thought-leadership]
    avoidWhen: [simple-promotion]
    visualFamilies: [product-system-story, process-explainer, data-story, character-narrative]
    languages: [ar, en]
    anthropomorphismLevels: [1, 2, 3, 4]
    strongReferenceIds: [ref_51e708951ea61f18, ref_f5cec23c32415d6e, ref_4afce40fe49062b6]
    aurendorApplication: "Define the initial state, transforming behavior, and verifiable end state in the brief; never use abstract lines without a state meaning."
    retrievalTags: [system, state, transformation, infrastructure, process]
    mustNotCopy: "Do not reuse the source's modular units, arrows, nodes, or state sequence."
  - id: STORY_CONTEXTUAL_MICRODETAILS
    name: Contextual microdetails
    description: "Use a few secondary labels, traces, wear marks, or evidence objects that reveal how the world works and reinforce the main idea."
    whyItWorks: "Meaningful detail creates credibility and atmosphere while maintaining a clear first read."
    appropriateFor: [case-study, product-introduction, education, storytelling]
    avoidWhen: [minimal-statement, tiny-thumbnail]
    visualFamilies: [conceptual-hero, product-system-story, character-narrative, case-study]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_6dd0a9246092f4d5, ref_7ea2e6edfd24a465, ref_4afce40fe49062b6]
    aurendorApplication: "Every microelement must answer what happened, how the system behaves, or what counts as evidence; otherwise remove it."
    retrievalTags: [detail, evidence, context, atmosphere, craft]
    mustNotCopy: "Do not lift labels, icons, textures, or props from a reference."
