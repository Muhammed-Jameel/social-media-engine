schemaVersion: 1.0.0
domain: arabic-design
principles:
  - id: AR_COMPOSE_RTL_FIRST
    name: Compose from the Arabic reading entry
    description: "Build hierarchy, mass balance, eye path, and text zones around RTL reading before imagery is finalized."
    whyItWorks: "Arabic is not a mirrored Latin layout; its joins, word silhouettes, and reading entry create different visual forces."
    appropriateFor: [awareness, education, promotion, announcement, thought-leadership, case-study, editorial]
    avoidWhen: [none]
    visualFamilies: [conceptual-hero, editorial-statement, product-system-story, data-story, arabic-educational-carousel]
    languages: [ar]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_8871f98455278188, ref_8ef6ff7e70837523, ref_2ca843f06643d5f6]
    socialMediaPluginApplication: "Choose Arabic line breaks and right-edge relationships during concept design; never finish English and replace its strings."
    retrievalTags: [arabic, rtl, composition, hierarchy, original]
    mustNotCopy: "Do not mirror a reference grid or transfer its Arabic phrase, lettering, or decorative forms."
  - id: AR_SEMANTIC_LINE_BREAKS
    name: Semantic Arabic line breaks
    description: "Break headlines at complete meaning units while protecting attached particles, short prepositions, and emphatic words from orphaning."
    whyItWorks: "Arabic line rhythm depends on connected word silhouettes and meaning; arbitrary width wrapping damages both comprehension and form."
    appropriateFor: [awareness, education, thought-leadership, announcement, editorial]
    avoidWhen: [single-word-display]
    visualFamilies: [conceptual-hero, editorial-statement, announcement, arabic-educational-carousel]
    languages: [ar]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_8ef6ff7e70837523, ref_8871f98455278188, ref_3991533a0cc6d024]
    socialMediaPluginApplication: "Store authored headline lines explicitly, preview them in Ghroob, and reject JavaScript character-count wrapping."
    retrievalTags: [arabic, line-break, headline, rhythm, meaning]
    mustNotCopy: "Do not reuse a reference's wording, calligraphic arrangement, or line-break silhouette."
  - id: AR_NO_TRACKING
    name: Never track connected Arabic
    description: "Do not apply Latin-style letter spacing to connected Arabic; create emphasis through weight, size, color, or carefully chosen alternates."
    whyItWorks: "Tracking can break joins and distort the script's native rhythm, making typography look technically and culturally careless."
    appropriateFor: [awareness, education, promotion, announcement, thought-leadership, case-study, editorial]
    avoidWhen: [isolated-latin-acronym]
    visualFamilies: [conceptual-hero, editorial-statement, product-system-story, data-story, announcement, arabic-educational-carousel]
    languages: [ar]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_8871f98455278188, ref_8ef6ff7e70837523]
    socialMediaPluginApplication: "Set Arabic tracking to normal, validate shaping after font load, and treat any broken joining as an automatic rejection."
    retrievalTags: [arabic, tracking, shaping, joins, typography]
    mustNotCopy: "Do not imitate custom lettering visible in a reference."
  - id: AR_BILINGUAL_OPTICAL_BASELINE
    name: Optical bilingual baseline
    description: "Align Arabic and Latin by perceived cap/body mass and baseline behavior rather than identical numeric font sizes."
    whyItWorks: "Equal point sizes rarely create equal visual presence across scripts; optical calibration yields a coherent bilingual voice."
    appropriateFor: [product-introduction, case-study, announcement, brand-building, event]
    avoidWhen: [monolingual-post]
    visualFamilies: [product-system-story, case-study, announcement, editorial-statement]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_2ca843f06643d5f6, ref_8871f98455278188, ref_7ea2e6edfd24a465]
    socialMediaPluginApplication: "Tune Ghroob and Dh Ranclo sizes and vertical offsets optically; record the relationship instead of forcing shared CSS values."
    retrievalTags: [arabic, bilingual, baseline, latin, optical]
    mustNotCopy: "Do not transplant a reference's bilingual lockup or script proportions."
  - id: AR_MIXED_SCRIPT_ISLANDS
    name: Controlled mixed-script islands
    description: "Keep product names, URLs, Latin acronyms, and numbers in deliberate directional spans with stable punctuation and spacing."
    whyItWorks: "Explicit bidi isolation prevents reordered punctuation, broken numerals, and visual noise in Arabic-first layouts."
    appropriateFor: [education, product-introduction, service-explanation, statistic, case-study]
    avoidWhen: [pure-arabic-statement]
    visualFamilies: [data-story, product-system-story, process-explainer, arabic-educational-carousel]
    languages: [ar]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_3991533a0cc6d024, ref_2ca843f06643d5f6, ref_8ef6ff7e70837523]
    socialMediaPluginApplication: "Use isolated directional spans, choose numeral style intentionally, and inspect every mixed-script line in final pixels."
    retrievalTags: [arabic, bidi, numerals, punctuation, mixed-script]
    mustNotCopy: "Do not reuse source data, product UI, acronyms, or labels."
  - id: AR_DENSITY_BY_ROLE
    name: Arabic density by role
    description: "Limit the cover to one short thesis and move proof, explanation, and detail into supporting slides or caption layers."
    whyItWorks: "Arabic's joined silhouettes and often wider semantic phrases need room; role-based density preserves authority and mobile comprehension."
    appropriateFor: [education, thought-leadership, case-study, service-explanation]
    avoidWhen: [mandatory-single-frame-disclosure]
    visualFamilies: [editorial-statement, arabic-educational-carousel, case-study, process-explainer]
    languages: [ar]
    anthropomorphismLevels: [0, 1, 2, 3]
    strongReferenceIds: [ref_8871f98455278188, ref_8ef6ff7e70837523, ref_3991533a0cc6d024]
    socialMediaPluginApplication: "Use a maximum of one headline plus one evidence phrase on covers; never compress body copy to preserve a fixed template."
    retrievalTags: [arabic, density, carousel, mobile, hierarchy]
    mustNotCopy: "Do not copy a reference's content split, slide order, or caption treatment."
  - id: AR_OPTICAL_RIGHT_EDGE
    name: Optical right-edge alignment
    description: "Adjust Arabic blocks for glyph overhang, punctuation, and letterform mass rather than trusting geometric bounding boxes alone."
    whyItWorks: "Optical alignment creates a calm, intentional edge even when glyph shapes do not share a mechanical boundary."
    appropriateFor: [awareness, education, promotion, announcement, thought-leadership, editorial]
    avoidWhen: [centered-single-word]
    visualFamilies: [editorial-statement, conceptual-hero, announcement, arabic-educational-carousel]
    languages: [ar]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_8ef6ff7e70837523, ref_8871f98455278188]
    socialMediaPluginApplication: "Measure browser glyph bounds, then make a documented optical correction at final raster scale."
    retrievalTags: [arabic, optical, alignment, edge, typography]
    mustNotCopy: "Do not reproduce a source's typographic outline or placement."
  - id: AR_PIXEL_PROOF_REQUIRED
    name: Arabic requires final-pixel proof
    description: "Validate shaping, joins, diacritics, punctuation, numerals, clipping, and font substitution in the final rendered asset at original and mobile sizes."
    whyItWorks: "Source strings and SVG metadata cannot prove that the browser or exporter rendered professional Arabic."
    appropriateFor: [awareness, education, promotion, announcement, product-introduction, case-study, editorial]
    avoidWhen: [none]
    visualFamilies: [conceptual-hero, editorial-statement, product-system-story, data-story, announcement, arabic-educational-carousel]
    languages: [ar]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_8871f98455278188, ref_8ef6ff7e70837523, ref_2ca843f06643d5f6]
    socialMediaPluginApplication: "Require the Arabic Design Reviewer to inspect current-hash pixels; missing font evidence or substituted glyphs blocks release."
    retrievalTags: [arabic, pixels, qa, shaping, mobile]
    mustNotCopy: "References are quality anchors only and never substitute for reviewing SOCIAL_MEDIA_PLUGIN's rendered Arabic."
