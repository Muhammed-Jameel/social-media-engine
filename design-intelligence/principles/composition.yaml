schemaVersion: 1.0.0
domain: composition
principles:
  - id: COMP_FOCAL_DOMINANCE
    name: Semantic focal dominance
    description: "Give one meaning-bearing object or typographic phrase decisively more visual weight than every supporting element."
    whyItWorks: "A steep weight hierarchy gives the eye an entry point within one second and makes the communication feel authored rather than assembled."
    appropriateFor: [awareness, education, promotion, thought-leadership, storytelling, brand-building]
    avoidWhen: [dense-case-study, multi-series-comparison]
    visualFamilies: [conceptual-hero, editorial-statement, character-narrative, announcement]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_6dd0a9246092f4d5, ref_97c66851c15d6c1f, ref_8871f98455278188]
    socialMediaPluginApplication: "Allocate roughly half the perceived visual weight to one operational actor, object, or phrase; demote the logo and explanatory copy."
    retrievalTags: [focus, immediate, single, awareness, clarity, hero]
    mustNotCopy: "Do not reuse the source subject, silhouette, crop, camera angle, or headline placement."
  - id: COMP_ASYMMETRIC_COUNTERWEIGHT
    name: Asymmetric counterweight
    description: "Place the focal mass off-center and balance it with purposeful negative space or a smaller information block rather than mirrored decoration."
    whyItWorks: "Unequal masses create tension and directional flow while the counter-field protects readability and visual confidence."
    appropriateFor: [awareness, thought-leadership, product-introduction, brand-building, editorial]
    avoidWhen: [formal-data-table, tightly-sequenced-process]
    visualFamilies: [conceptual-hero, editorial-statement, product-system-story]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3]
    strongReferenceIds: [ref_51e708951ea61f18, ref_7ea2e6edfd24a465, ref_2ca843f06643d5f6]
    socialMediaPluginApplication: "For Arabic, bias the information counterweight toward the right reading entry while allowing the conceptual mass to pull left or diagonally."
    retrievalTags: [asymmetry, balance, space, tension, rtl, editorial]
    mustNotCopy: "Do not mirror or trace any source grid; re-derive mass placement from the new message and script direction."
  - id: COMP_SEMANTIC_DEPTH
    name: Semantic depth planes
    description: "Use foreground, middle ground, and background to separate actors, consequences, and context rather than stacking flat cards."
    whyItWorks: "Depth establishes relationships and causality, lets the viewer understand what acts on what, and creates production richness without ornamental clutter."
    appropriateFor: [service-explanation, product-introduction, storytelling, case-study, education]
    avoidWhen: [pure-typographic-statement, legal-disclosure]
    visualFamilies: [conceptual-hero, product-system-story, character-narrative, before-after]
    languages: [ar, en]
    anthropomorphismLevels: [1, 2, 3, 4, 5]
    strongReferenceIds: [ref_6dd0a9246092f4d5, ref_2ca843f06643d5f6, ref_f5593ec327689f0a]
    socialMediaPluginApplication: "Put the operational problem in the foreground, the intelligent system at the action plane, and environmental evidence in the background."
    retrievalTags: [depth, relationship, action, environment, narrative]
    mustNotCopy: "Do not reproduce a source scene, character arrangement, environment, or perspective."
  - id: COMP_PURPOSEFUL_CROP
    name: Purposeful crop and continuation
    description: "Crop a dominant subject at an edge when the continuation outside the frame reinforces scale, motion, or immediacy."
    whyItWorks: "A deliberate crop makes the canvas feel like a captured moment in a larger world and avoids presentation-board stiffness."
    appropriateFor: [awareness, promotion, product-introduction, storytelling]
    avoidWhen: [diagram, exact-product-proof, case-study-evidence]
    visualFamilies: [conceptual-hero, character-narrative, product-system-story]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_97c66851c15d6c1f, ref_8871f98455278188, ref_f5593ec327689f0a]
    socialMediaPluginApplication: "Crop only where the implied continuation serves the idea; keep faces, Arabic letterforms, and proof-bearing UI intact."
    retrievalTags: [crop, motion, scale, energy, immediacy]
    mustNotCopy: "Do not imitate the source crop, pose, or object orientation."
  - id: COMP_NEGATIVE_SPACE_HAS_A_JOB
    name: Negative space has a job
    description: "Reserve calm space to stage a headline, direct attention, imply absence, or control feed rhythm; never leave it as accidental emptiness."
    whyItWorks: "Purposeful space increases contrast between information levels and makes fewer elements feel more intentional."
    appropriateFor: [thought-leadership, editorial, brand-building, statistic, announcement]
    avoidWhen: [high-density-explainer, mandatory-disclosure]
    visualFamilies: [editorial-statement, conceptual-hero, announcement, data-story]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3]
    strongReferenceIds: [ref_51e708951ea61f18, ref_7ea2e6edfd24a465, ref_ac0d35ccf58d8eb9]
    socialMediaPluginApplication: "Declare the role of every large empty region in the brief: headline field, absence metaphor, gaze destination, or monthly-feed breathing beat."
    retrievalTags: [space, restraint, editorial, quiet, premium]
    mustNotCopy: "Do not transplant the source's blank-field proportion or exact text position."
  - id: COMP_SYSTEM_VARIATION_NOT_TEMPLATE
    name: System variation without structural repetition
    description: "Keep stable brand behaviors while changing focal geometry, scale, crop, and text-image relationship to suit each message."
    whyItWorks: "Recognition comes from consistent decisions while variation prevents the feed from revealing a replace-the-text template."
    appropriateFor: [education, promotion, service-explanation, thought-leadership, case-study, brand-building]
    avoidWhen: [single-one-off-event]
    visualFamilies: [conceptual-hero, editorial-statement, product-system-story, data-story, process-explainer, arabic-educational-carousel]
    languages: [ar, en]
    anthropomorphismLevels: [0, 1, 2, 3, 4, 5]
    strongReferenceIds: [ref_51e708951ea61f18, ref_f5cec23c32415d6e, ref_7ea2e6edfd24a465]
    socialMediaPluginApplication: "Repeat material, light behavior, color charge, and typographic voice; prohibit repeating the same header-frame-action-rail skeleton."
    retrievalTags: [system, campaign, coherence, variation, feed]
    mustNotCopy: "Do not reproduce any source campaign's modules, motif, or sequence structure."
