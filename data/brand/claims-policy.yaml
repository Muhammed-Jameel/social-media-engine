schemaVersion: 1.0.0
brandVersion: final-2026.1
classes:
  safe:
    - sourced product capability
    - brand positioning and mission
    - general educational process advice framed without guarantees
  requiresStrongSource:
    - market statistics
    - quantified time or cost savings
    - performance comparisons
    - current platform or technology facts
  itemApproval:
    - pricing and offers
    - new product announcements
    - named customer or case study
    - legal, regulatory, financial, medical, political, or security claim
    - claim with unresolved source conflict
  prohibitedWithoutExplicitPermission:
    - customer identity or private data
    - invented testimonial
    - guaranteed outcome
    - unsupported superlative or market leadership claim
rules:
  - Every factual claim stores source IDs and support status.
  - No citation means the claim must be durable/common knowledge or removed.
  - Current-event claims require dated primary sources.
  - A model confidence score is not evidence.

