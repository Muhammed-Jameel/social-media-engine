schemaVersion: 1.0.0
brandVersion: final-2026.1
weights:
  conceptOriginality: 14
  hierarchy: 12
  typography: 12
  compositionGrid: 10
  brandDistinctiveness: 10
  messageClarity: 10
  readabilityMobile: 8
  whitespace: 7
  graphicQuality: 6
  colorContrast: 5
  platformSuitability: 3
  polish: 3
bands:
  rejectBelow: 75
  reviseBelow: 88
  strongBelow: 93
  publicationCandidateAt: 93
criticDisagreementMargin: 8
hardFails:
  - unreadable or clipped text
  - wrong logo or canonical brand color
  - Arabic shaping, spelling, or RTL failure
  - factual error
  - visible placeholder or watermark
  - distorted people, products, or logos
  - objectifying, sexualized, or ornamental human imagery
  - a woman used as an attention device rather than a subject with agency
  - a visible person without a documented narrative role
  - incoherent hierarchy
  - unlicensed asset
  - unintended overlap or crop
  - unjustified near-duplicate creative
dualCriticPolicy:
  pass: both critics meet threshold and report no hard fail
  adjudicate: score gap exceeds disagreement margin
  rebuild: any hard fail or repeated revision failure
