name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DEMO_MODE: "true"
      DRY_RUN: "true"
      PRODUCTION_PUBLISHING_ENABLED: "false"
      AURENDOR_ENGINE_PAUSED: "false"
      PGLITE_DATA_DIR: .data/ci-pglite
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan repository for secrets
        run: pnpm exec tsx scripts/check-secrets.mts

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit and contract tests
        run: pnpm test

      - name: Prepare local database
        run: pnpm db:migrate && pnpm db:seed

      - name: Build
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end browser tests
        run: pnpm test:e2e
