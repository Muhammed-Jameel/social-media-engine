name: Release plugin
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - name: Check tag version
        run: |
          python -c 'import json,os; v=json.load(open("plugins/social-media-engine/.codex-plugin/plugin.json"))["version"]; assert os.environ["GITHUB_REF_NAME"] == "v"+v'
      - run: python scripts/build_release.py
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/social-media-engine-*.zip dist/SHA256SUMS --verify-tag --generate-notes
